<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dent-Care - Dental Hospital Management System</title>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- App Stylesheets -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/odontogram.css" />
  <link rel="stylesheet" href="css/lab-kanban.css" />
</head>
<body class="sim-device-desktop">

  <div id="app-container">
    <!-- TOP SIMULATOR TOOLBAR -->
    <div class="simulator-toolbar">
      <div class="sim-group">
        <label><i data-lucide="sliders" style="width:14px; height:14px; vertical-align:middle;"></i> Dynamic Permission Switcher:</label>
        
        <select id="sim-user-select" title="Switch User Persona">
          <option value="usr_101">Dr. Rahul Sharma (Dentist)</option>
          <option value="usr_102">Dr. Priya Patel (Endodontist)</option>
          <option value="usr_103">Sarah Jenkins (Receptionist)</option>
          <option value="usr_104">Mark Vance (Admin)</option>
        </select>

        <select id="sim-device-select" title="Switch Device Type">
          <option value="desktop">Desktop Workstation</option>
          <option value="tablet">Clinical Tablet</option>
          <option value="mobile">Mobile Device</option>
        </select>
      </div>

      <div class="sim-group" style="display:flex; align-items:center; gap:0.5rem;">
        <button id="btn-supabase-config" class="btn btn-secondary btn-sm" style="display:inline-flex; align-items:center; gap:0.4rem; font-size:0.78rem; padding:0.25rem 0.6rem; border-radius:6px; background:#0f172a; color:#38bdf8; border:1px solid #1e293b; cursor:pointer;">
          <i data-lucide="database" style="width:14px; height:14px;"></i> Supabase Database
        </button>

        <span class="device-badge" id="sim-active-rule-badge">
          <i data-lucide="shield"></i> Security Policy Active
        </span>
      </div>
    </div>

    <!-- MAIN APP WORKSPACE -->
    <div class="main-wrapper">
      <!-- SIDEBAR CONTAINER -->
      <aside id="sidebar-container"></aside>

      <!-- CONTENT AREA -->
      <div class="content-area">
        <!-- TOPBAR HEADER -->
        <header id="topbar-container"></header>

        <!-- MAIN DYNAMIC VIEW -->
        <main id="view-container"></main>
      </div>
    </div>
  </div>

  <!-- Main ES Module Script -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
